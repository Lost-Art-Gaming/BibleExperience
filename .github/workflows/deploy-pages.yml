name: Deploy Bible Experience

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify uploaded artwork
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' file; do
            found=1
            mime="$(file --brief --mime-type "$file")"
            case "$mime" in
              image/jpeg|image/png) echo "OK: $file ($mime)" ;;
              *) echo "Invalid artwork: $file ($mime)"; exit 1 ;;
            esac
          done < <(find public/assets -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) -print0 | sort -z)
          if [ "$found" -eq 0 ]; then
            echo "No JPEG/PNG artwork found in public/assets/"
            exit 1
          fi
          echo "Uploaded artwork passed validation. Missing future artwork is allowed during the incremental asset rollout."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
