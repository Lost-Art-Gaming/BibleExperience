name: Deploy Bible Experience

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  STATIC_VERSION: 27

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify uploaded artwork
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' file; do
            found=1
            mime="$(file --brief --mime-type "$file")"
            case "$mime" in
              image/jpeg|image/png) echo "OK: $file ($mime)" ;;
              *) echo "Invalid artwork: $file ($mime)"; exit 1 ;;
            esac
          done < <(find assets -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) -print0 | sort -z)
          if [ "$found" -eq 0 ]; then
            echo "No JPEG/PNG artwork found in assets/"
            exit 1
          fi
          echo "Uploaded artwork passed validation. Missing future artwork is allowed during the incremental asset rollout."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -av --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/

      - name: Publish build version
        run: |
          set -euo pipefail
          printf '{"release":"%s","commit":"%s","shortCommit":"%s","run":%s,"publishedAt":"%s"}\n' \
            "$STATIC_VERSION" "$GITHUB_SHA" "${GITHUB_SHA:0:7}" "$GITHUB_RUN_NUMBER" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > _site/version.json
          # Keep the browser asset version and service-worker cache version aligned.
          sed -i -E "s/\?v=[0-9]+/\?v=${STATIC_VERSION}/g" _site/index.html _site/sw.js
          sed -i -E "s/bible-experience-production-v[0-9]+/bible-experience-production-v${STATIC_VERSION}/g" _site/sw.js
          echo "Published release ${STATIC_VERSION} (${GITHUB_SHA:0:7})"
          cat _site/version.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
