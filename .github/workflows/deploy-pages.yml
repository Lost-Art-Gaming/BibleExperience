name: Deploy Bible Experience

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify production image assets
        run: |
          set -euo pipefail
          required=(
            "assets/hero-origins.jpg"
            "assets/ep01-beginning.jpg"
            "assets/ep02-eden.jpg"
            "assets/ep03-serpent.jpg"
            "assets/ep04-east-of-eden.jpg"
            "assets/ep05-adams-story.jpg"
            "assets/ep06-noah.jpg"
            "assets/ep07-deluge.jpg"
            "assets/ep08-bow.jpg"
            "assets/ep09-babel.jpg"
            "assets/ep10-abraham.jpg"
            "assets/explore-geography.jpg"
            "assets/study-reflect.jpg"
            "assets/your-journey.jpg"
          )
          missing=0
          for file in "${required[@]}"; do
            if [ ! -s "$file" ]; then
              echo "Missing production artwork: $file"
              missing=1
            else
              mime="$(file --brief --mime-type "$file")"
              case "$mime" in
                image/jpeg|image/png) echo "OK: $file ($mime)" ;;
                *) echo "Invalid artwork: $file ($mime)"; missing=1 ;;
              esac
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Artwork validation failed: upload the complete production artwork set before deployment."
            exit 1
          fi
          echo "All production artwork passed validation."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -av --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
