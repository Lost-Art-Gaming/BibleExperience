<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#071018" />
  <meta name="description" content="The Bible Experience — see, understand, believe." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <title>The Bible Experience</title>
  <link rel="stylesheet" href="styles.css?v=15" />
  <link rel="stylesheet" href="production.css?v=15" />
  <style>
    /* Critical visual guarantees: these remain local to the shell so the hero and desktop navigation cannot be hidden by legacy rules. */
    .hero-home { background-image:url('assets/hero-origins-generated.webp?v=15') !important; background-size:cover !important; background-position:center center !important; }
    @media (min-width:901px) {
      .bottom-nav { position:absolute !important; top:0 !important; bottom:auto !important; left:50% !important; transform:translateX(-50%) !important; width:min(620px,48vw) !important; min-width:500px !important; padding:0 !important; border:0 !important; border-radius:0 !important; background:transparent !important; box-shadow:none !important; backdrop-filter:none !important; }
      .nav-item { min-height:78px !important; border-radius:0 !important; background:transparent !important; color:rgba(244,239,229,.72) !important; font-size:11px !important; }
      .nav-item.active { color:#fff !important; background:transparent !important; box-shadow:inset 0 -2px 0 var(--gold-2) !important; }
      .hero-home { height:clamp(500px,62vh,640px) !important; min-height:500px !important; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="app.js?v=15"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js?v=16').catch(() => {}));
    }
  </script>
</body>
</html>
